{% extends "base.html" %}

{% block title %}
    Login - MultiUserBlog
{% endblock %}


{% block content %}

<div class="form-wrapper">

    <div class="form-card">

        <h1>Welcome Back</h1>

        <p class="form-description">
            Login to your MultiUserBlog account.
        </p>


        <form method="POST"
              action="{{ url_for('auth.login') }}">

            <!-- Username or Email -->

            <div class="form-group">

                <label for="username">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter username or email"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="btn btn-primary"
                style="width: 100%;"
            >
                Login
            </button>

        </form>


        <div class="form-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">
                    Create an account
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
