{% extends "base.html" %}

{% block title %}
    Register - MultiUserBlog
{% endblock %}


{% block content %}

<div class="form-wrapper">

    <div class="form-card">

        <h1>Create Your Account</h1>

        <p class="form-description">
            Join MultiUserBlog and start sharing your ideas.
        </p>


        <form method="POST"
              action="{{ url_for('auth.register') }}">

            <!-- Full Name -->

            <div class="form-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    class="form-control"
                    placeholder="Enter your full name"
                    maxlength="120"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Choose a username"
                    maxlength="80"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    maxlength="150"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Enter password again"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="btn btn-primary"
                style="width: 100%;"
            >
                Create Account
            </button>

        </form>


        <div class="form-footer">

            <p>
                Already have an account?

                <a href="{{ url_for('auth.login') }}">
                    Login here
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
