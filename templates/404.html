{% extends "base.html" %}

{% block title %}

{% endblock %}


{% block content %}

    <div class="error-page">

        <div>

            <h1>
                404
            </h1>

            <h2>
                Page Not Found

            <p>

            <a

                Back to Home

        </div>

    </div>

</div>

{% endblock %}
