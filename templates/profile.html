{% extends "base.html" %}

{% block content %}

<div class="profile-container">

    <h1>My Profile</h1>


    <div class="profile-image-section">

        {% if current_user.profile_image %}

            <img
                src="{{ url_for('static', filename='uploads/' + current_user.profile_image) }}"
                alt="{{ current_user.full_name }}"
                class="profile-image"
            >

        {% else %}

            <img
                src="{{ url_for('static', filename='images/default-avatar.png') }}"
                alt="Default Profile"
                class="profile-image"
            >

        {% endif %}

    </div>


    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="form-group">

            <label for="full_name">
                Full Name
            </label>

            <input
                type="text"
                id="full_name"
                name="full_name"
                value="{{ current_user.full_name }}"
                maxlength="120"
                required
            >

        </div>


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                value="{{ current_user.username }}"
                disabled
            >

            <small>
                Username cannot be changed.
            </small>

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ current_user.email }}"
                maxlength="150"
                required
            >

        </div>


        <div class="form-group">

            <label for="bio">
                Bio
            </label>

            <textarea
                id="bio"
                name="bio"
                rows="5"
                placeholder="Tell us something about yourself..."
            >{{ current_user.bio or '' }}</textarea>

        </div>


        <div class="form-group">

            <label for="profile_image">
                Change Profile Picture
            </label>

            <input
                type="file"
                id="profile_image"
                name="profile_image"
                accept=".jpg,.jpeg,.png,.gif,.webp"
            >

            <small>
                Allowed: JPG, JPEG, PNG, GIF, WEBP.
                Maximum size: 5 MB.
            </small>

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
