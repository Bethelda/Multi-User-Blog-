{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Edit Post</h1>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="form-group">

            <label for="title">
                Post Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ post.title }}"
                maxlength="200"
                required
            >

        </div>


        <div class="form-group">

            <label for="content">
                Content
            </label>

            <textarea
                id="content"
                name="content"
                rows="12"
                required
            >{{ post.content }}</textarea>

        </div>


        {% if post.image %}

        <div class="current-image">

            <p>
                Current Image:
            </p>

            <img
                src="{{ url_for('static', filename='uploads/' + post.image) }}"
                alt="{{ post.title }}"
                class="post-preview-image"
            >

        </div>

        {% endif %}


        <div class="form-group">

            <label for="image">
                Replace Image
            </label>

            <input
                type="file"
                id="image"
                name="image"
                accept=".jpg,.jpeg,.png,.gif,.webp"
            >

            <small>
                Leave empty to keep the current image.
            </small>

        </div>


        <div class="form-check">

            <input
                type="checkbox"
                id="published"
                name="published"
                {% if post.published %}checked{% endif %}
            >

            <label for="published">
                Published
            </label>

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Update Post
        </button>


        <a
            href="{{ url_for('main.dashboard') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
