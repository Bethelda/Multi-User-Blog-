{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Create New Post</h1>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="form-group">

            <label for="title">
                Post Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter your post title"
                maxlength="200"
                required
            >

        </div>


        <div class="form-group">

            <label for="content">
                Content
            </label>

            <textarea
                id="content"
                name="content"
                rows="10"
                placeholder="Write your blog post..."
                required
            ></textarea>

        </div>


        <div class="form-group">

            <label for="image">
                Post Image
            </label>

            <input
                type="file"
                id="image"
                name="image"
                accept=".jpg,.jpeg,.png,.gif,.webp"
            >

            <small>
                Allowed: JPG, JPEG, PNG, GIF, WEBP.
                Maximum size: 5 MB.
            </small>

        </div>


        <div class="form-check">

            <input
                type="checkbox"
                id="published"
                name="published"
                checked
            >

            <label for="published">
                Publish this post
            </label>

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Create Post
        </button>


        <a
            href="{{ url_for('main.dashboard') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
